<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS 7 kundaligi</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700;7..72,800&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* DIZAYN: kirish sahifasidagi shablon butun saytda — chapda to'q ko'k "imtihon stoli" paneli
   (kontekst va progress), o'ngda qog'oz ish maydoni (bajariladigan ish). Menyu tepada.
   Belgi: javob varag'idagi doirachalar (hafta, Leitner, 238 kunlik varaq) va ikki halqa. */
:root{color-scheme:light dark;
--bg:light-dark(#f6f8fc,#10131c);--paper:light-dark(#ffffff,#171b28);--ink:light-dark(#18213b,#e6e9f2);--mut:light-dark(#5d6478,#a0a7bb);
--rule:light-dark(#e0e6f1,#282f43);--edge:light-dark(#c5cee2,#3a425c);--red:light-dark(#c41e3a,#ff6b7d);--blue:light-dark(#2f55b8,#8fa8ff);--soft:light-dark(#eef2f9,#1d2233);
--hl:light-dark(#ffe46b,#6b5a12);--hlbar:light-dark(#e9b500,#ffd43b);--hlsoft:light-dark(#fff6c7,#2b2614);--ok:light-dark(#1f7a4d,#6fd6a4);
--side:light-dark(#1b2547,#0c1124);--panel:light-dark(#1b2547,#151d3d);--sideink:#dfe5f5;--sidemut:#93a0c4;--yel:#ffe46b;--coral:#ff6b7d;
--r-lg:18px;--r-md:14px;--r-sm:10px;--top:64px;--ease:cubic-bezier(.2,.7,.2,1);
--dots:radial-gradient(circle at 1.5px 1.5px,#ffffff12 1.4px,transparent 1.9px) 0 0/22px 22px;
--lift:light-dark(0 1px 2px #18213b12,0 0 0 #0000)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) radial-gradient(circle at 1px 1px,light-dark(#18213b0d,#ffffff08) 1px,transparent 1.5px) 0 0/24px 24px fixed;color:var(--ink);font:16px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3{font-family:Literata,Georgia,serif;line-height:1.1;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.panel :focus-visible,.side :focus-visible{outline-color:var(--yel)}
.hide{display:none!important}

/* ---------- tepadagi menyu ---------- */
.side{position:sticky;top:0;z-index:12;height:var(--top);background:var(--side);color:var(--sideink);display:flex;align-items:center;gap:28px;padding:0 24px 0 28px;border-bottom:1px solid #ffffff1a}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font:800 19px/1 Literata,Georgia,serif;flex:none}
.brand i{width:7px;height:30px;background:var(--red);border-radius:2px;flex:none}
.brand em{display:block;font-style:normal;font-weight:500;font-size:13px;color:var(--sidemut);margin-top:3px}
#nav{display:flex;align-self:stretch;gap:2px;flex:1;justify-content:center}
#nav a{position:relative;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--sidemut);text-decoration:none;font-weight:700;font-size:15px;transition:color .16s,background-color .16s}
#nav a svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#nav a:hover{color:#fff;background:#ffffff0d}
#nav a.on{color:var(--yel)}
#nav a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:4px;border-radius:4px 4px 0 0;background:var(--yel)}
.sidestat{display:none}
.who{display:flex;align-items:center;gap:10px;flex:none}
.av{width:34px;height:34px;border-radius:50%;background:var(--yel);color:#18213b;display:grid;place-items:center;font:800 15px Literata,Georgia,serif;flex:none}
.wn2{max-width:130px}.wn2 b{display:block;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wn2 small{display:none}
.whobtn,.mwho{display:flex;align-items:center;gap:6px;border:1px solid #ffffff2e;background:transparent;color:var(--sideink);border-radius:9px;padding:6px 12px;min-height:38px;cursor:pointer;font:700 13px 'Atkinson Hyperlegible',system-ui,sans-serif}
.whobtn:hover{background:#ffffff14}.whobtn svg,.mwho svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mwho{display:none;border-radius:99px;padding:3px 8px 3px 3px;min-height:40px}.mwho .av{width:30px;height:30px;font-size:14px}
.mtop{display:none}
@media(max-width:1180px){#nav a{padding:0 9px;font-size:14px}#nav a svg{display:none}.wn2{display:none}.side{gap:14px;padding:0 14px}.whobtn span{display:none}}

/* ---------- ikki ustunli shablon ---------- */
main{display:block}
.split{display:grid;grid-template-columns:minmax(320px,380px) minmax(0,1fr);align-items:start;min-height:calc(100vh - var(--top))}
.panel{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#ffffff30 transparent;background:var(--panel) var(--dots);color:#e6eaf7;padding:34px 32px 40px 38px;display:flex;flex-direction:column;gap:18px;border-left:6px solid var(--red)}
.panel>*{flex:none}
.panel h1{color:#fff;font-size:clamp(30px,3vw,42px);letter-spacing:-.01em}
.panel h1.big{font-size:clamp(44px,3.7vw,54px);line-height:1}
.p-kick{color:var(--sidemut);font-weight:700;font-size:14.5px;margin-bottom:-10px}
.p-desc{color:#b8c2e0;margin:-6px 0 0;font-size:16px;max-width:46ch}
.work{padding:30px clamp(16px,3.2vw,48px) 90px;max-width:1040px;width:100%}
.work>h2,.sechead h2{font-size:26px}
.sechead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec{margin-top:34px}.sec>h2{font-size:24px;margin-bottom:10px}
.dial{width:min(230px,100%);height:auto;display:block;margin:2px auto}
.dial text{font-family:Literata,Georgia,serif;font-weight:800;fill:#fff}
.dial text.sm{font:700 11px "Atkinson Hyperlegible",system-ui,sans-serif;fill:#b8c2e0}
@media(prefers-reduced-motion:no-preference){.dial .arc{animation:arc .8s var(--ease) both}@keyframes arc{from{stroke-dashoffset:var(--c)}}}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font-size:13.5px;color:#b8c2e0;margin-top:-8px}
.keys span{display:inline-flex;align-items:center;gap:7px}.keys i{width:9px;height:9px;border-radius:50%;background:var(--yel)}.keys i.r{background:var(--coral)}
.facts{list-style:none;margin:0;padding:0;border-top:1px solid #ffffff1f}
.facts li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff1f;color:#b8c2e0;font-size:15px}
.facts b{color:var(--yel);font:800 22px Literata,Georgia,serif;white-space:nowrap}
.panel .linkbtn{color:var(--yel);align-self:center}

/* ---------- tugma va maydonlar ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--soft);border-radius:var(--r-sm);min-height:44px;padding:8px 16px;cursor:pointer;font-weight:700;text-decoration:none;transition:background-color .16s,border-color .16s,transform .08s}
.btn:hover{border-color:var(--blue)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:light-dark(#fff,#0e1430)}
.btn.pri:hover{background:light-dark(#2547a0,#a6b9ff)}
.btn.hl{background:var(--yel);border-color:var(--yel);color:#18213b}.btn.hl:hover{background:#ffd43b;border-color:#ffd43b}
.btn.ghost{background:transparent;border-color:#ffffff33;color:#fff}.btn.ghost:hover{background:#ffffff14;border-color:#ffffff66}
.linkbtn{background:none;border:0;padding:4px 2px;font:700 14px 'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:36px}
textarea,input[type=text],input[type=search],input[type=date],input[type=password],select{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-size:16px;min-height:46px;transition:border-color .16s,box-shadow .16s}
textarea{min-height:90px;resize:vertical}
textarea:focus,input:not([type=checkbox]):focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent);outline:0}
label{font-weight:700;font-size:14px;color:var(--mut);display:block;margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-md);padding:22px 22px 22px 46px;box-shadow:var(--lift);background-image:linear-gradient(to right,transparent 30px,var(--red) 30px,var(--red) 32px,transparent 32px)}
.dd{color:var(--ink);opacity:.86;font-size:15.5px}
.kick{color:var(--mut);font-weight:600;margin-bottom:6px}
.empty{color:var(--mut);padding:26px;border:2px dashed var(--rule);border-radius:var(--r-md);text-align:center}
.loading{color:var(--mut);padding:60px 24px;font-weight:700;text-align:center}
.banner{background:var(--paper);border:1px solid var(--rule);border-left:5px solid var(--red);padding:12px 16px;border-radius:var(--r-sm);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.banner a{font-weight:700}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:99px;margin-right:8px;color:#fff}
.c-vocab{background:#2e7d5b}.c-nav{background:#2f55b8}.c-gram{background:#7a3fb0}.c-pron{background:#a95a12}.c-write{background:#c41e3a}.c-test{background:#475069}
.bar{height:9px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--rule);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--hlbar);border-radius:9px}
.pct{font-size:13px;color:var(--mut);text-align:right;font-weight:700}

/* ---------- Bugun: panel ---------- */
.stamp{display:inline-block;font:600 23px/1 Caveat,cursive;color:var(--yel);transform:rotate(-6deg);margin-left:8px;vertical-align:middle;border:2px solid currentColor;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;padding:0 10px 4px;white-space:nowrap}
.weekbox{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;gap:6px;align-items:center;background:#ffffff0a;border:1px solid #ffffff1a;border-radius:var(--r-md);padding:12px 6px}
.navbtn{width:32px;height:44px;border:0;background:transparent;color:#fff;border-radius:8px;cursor:pointer;display:grid;place-items:center;padding:0}
.navbtn:hover:not(:disabled){background:#ffffff1a}.navbtn:disabled{opacity:.25;cursor:default}
.navbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.ws{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:#fff;padding:2px 0}
.ws b{width:32px;height:32px;max-width:100%;border-radius:50%;display:grid;place-items:center;font:800 13px Literata,Georgia,serif;position:relative;background:conic-gradient(var(--yel) var(--p),#ffffff2e 0);isolation:isolate}
.ws b::before{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--panel);z-index:-1}
.ws.full b{color:#18213b}.ws.full b::before{background:var(--yel)}
.ws.sel b{box-shadow:0 0 0 3px var(--panel),0 0 0 5px #fff}
.ws.tod b{color:var(--coral)}.ws.tod b::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--coral)}
.ws span{display:none}

/* ---------- Bugun: vazifalar zinapoyasi ---------- */
.timeline{display:flex;gap:3px;height:34px;margin-bottom:4px}
.timeline div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;padding:0 4px;border-radius:7px}
.tl-lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);font-weight:700;margin-bottom:22px}
.steps-l{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;position:relative;padding-bottom:14px}
.step::before{content:"";position:absolute;left:27px;top:46px;bottom:-2px;width:2px;background:var(--rule)}
.step:last-child::before{display:none}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:14px}
.chk{appearance:none;-webkit-appearance:none;width:34px;height:34px;margin:0;border-radius:50%;border:2.5px solid var(--edge);background:var(--paper);cursor:pointer;display:grid;place-items:center;position:relative;z-index:1;transition:background-color .16s,border-color .16s}
.chk:hover{border-color:var(--hlbar)}
.chk:checked{background:var(--yel);border-color:#e9b500}
.chk:checked::after{content:"";width:7px;height:13px;border:solid #18213b;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.node small{font-size:12px;font-weight:700;color:var(--mut);background:var(--bg);position:relative;z-index:1;padding:1px 3px}
.tk{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-md);box-shadow:var(--lift);padding:0 20px;transition:border-color .16s}
.tk:hover{border-color:var(--edge)}
.tk[open]{border-color:var(--cc);border-width:2px;padding:0 19px}
.tk>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:16px 0;align-items:start}
.tk>summary::-webkit-details-marker{display:none}
.bk{font-size:14px;color:var(--mut);font-weight:700}
.tt{font-weight:700;font-size:19px;margin:6px 0 2px;width:fit-content;max-width:100%}
.step.done .tt{background:linear-gradient(transparent 55%,var(--hl) 55% 92%,transparent 92%)}
.step.done .tk:not([open]){background:var(--hlsoft);border-color:color-mix(in srgb,var(--hlbar) 45%,var(--rule))}
.min{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font:800 15px Literata,Georgia,serif;color:var(--mut);white-space:nowrap}
.min svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s var(--ease)}
.tk[open] .min svg{transform:rotate(180deg)}
.xd{border-top:1px dashed var(--rule);padding:16px 0 20px;display:grid;gap:16px}
.xd h4{font:700 14px "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--mut);margin:0 0 6px}
.goalline{background:var(--soft);border-radius:var(--r-sm);padding:10px 14px;font-weight:700;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.tbtn{min-height:38px;padding:4px 14px;font-size:14px;background:var(--paper)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 14px;font-size:15px;margin:0}.kv dt{font-weight:700;color:var(--mut)}.kv dd{margin:0;overflow-wrap:anywhere}
.steps{margin:0;padding-left:22px}.steps li{margin:4px 0}
table.secs{width:100%;font-size:14.5px;border-collapse:collapse}.secs td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}.secs td:last-child{text-align:right;white-space:nowrap;color:var(--mut)}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.words button{border:1px solid var(--rule);background:var(--soft);border-radius:99px;padding:4px 12px;font-size:14.5px;cursor:pointer;min-height:34px}
.words button:hover{background:var(--hlsoft);border-color:var(--hlbar)}
.words button.have{border-color:var(--ok);color:var(--ok);font-weight:700}
.frames{display:grid;gap:6px}.frames div{background:var(--soft);border-radius:8px;padding:8px 12px;font-family:Literata,Georgia,serif;font-size:15.5px}
.file{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--rule);border-radius:var(--r-sm);margin-bottom:6px}
.file .fp{flex:1 1 260px;font-size:13px;color:var(--mut);overflow-wrap:anywhere}.file b{font-size:14.5px}.file .btn{min-height:36px;padding:4px 10px;font-size:14px}
textarea.wr{font:17px/1.6 Literata,Georgia,serif;background-image:repeating-linear-gradient(transparent 0 26.2px,var(--rule) 26.2px 27.2px);background-attachment:local;padding-top:6px;min-height:150px}
.wrbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}.wc{font-weight:700;color:var(--mut);font-size:14.5px}
.finish{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;background:var(--paper);border:2px dashed var(--hlbar);border-radius:var(--r-md);padding:18px 20px;margin:10px 0 16px}
.finish.is-done{border-style:solid;background:var(--hlsoft)}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.frow input[type=date]{width:auto}

/* ---------- Kalendar ---------- */
.yearh{display:flex;align-items:center;gap:14px;font-size:26px;margin:0 0 14px;scroll-margin-top:calc(var(--top) + 16px)}.yearh::after{content:"";flex:1;height:2px;background:var(--rule)}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px;margin-bottom:32px}
.mon{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-md);padding:16px 14px 14px;box-shadow:var(--lift)}
.mon h3{font-size:18px;margin-bottom:10px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mgrid .wd{font-size:11.5px;font-weight:700;color:var(--mut);text-align:center;padding:2px 0 4px}
.cell{aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;align-content:center;position:relative;font:700 13px Literata,Georgia,serif;background:var(--soft);color:var(--ink)}
.cell.blank{background:none}.cell.fut{background:none;color:var(--mut);opacity:.65}
.cell.full{background:var(--yel);color:#18213b}
.cell.tod{box-shadow:inset 0 0 0 2.5px var(--red)}
.cell .cdays{position:absolute;right:-3px;bottom:-4px;display:flex;gap:1px}
.cell .cdays a{font:700 10px/15px 'Atkinson Hyperlegible',system-ui,sans-serif;min-width:15px;text-align:center;background:#1b2547;color:#fff;border-radius:99px;padding:0 3px;text-decoration:none;box-shadow:0 0 0 1.5px var(--paper)}

/* ---------- Roadmap ---------- */
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stg{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:#ffffff0a;border:1px solid #ffffff1a;border-radius:var(--r-md);padding:12px 14px}
.stg>b{grid-row:1/3;font:800 20px Literata,Georgia,serif;color:var(--yel)}.stg span{font-weight:700}.stg small{grid-column:2/4;color:var(--sidemut);font-size:13px;margin-top:-4px}
.stg em{font-style:normal;font-size:13px;color:#b8c2e0;font-weight:700}.stg .bar{grid-column:1/4;background:#ffffff1f;box-shadow:none;height:6px;margin-top:4px}
.stg.now{border-color:var(--coral);background:#ff6b7d14}
.month{margin:30px 0 12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.month:first-child{margin-top:0}
.month h2{font-size:24px}.month span{color:var(--mut);font-weight:700;font-size:14px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
details.wk{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-md);box-shadow:var(--lift);transition:border-color .16s}
details.wk:hover{border-color:var(--edge)}
details.wk[open]{grid-column:1/-1}details.wk[open]>summary{height:auto}
details.wk>summary{list-style:none;cursor:pointer;padding:16px;display:flex;flex-direction:column;gap:8px;height:100%}
details.wk>summary::-webkit-details-marker{display:none}
.whead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wn{font:800 28px/1 Literata,Georgia,serif;color:var(--red)}.wn small{font:700 12.5px "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--mut);margin-left:2px}
.wsum b{display:block;font-size:16px;line-height:1.35}.wsum span{display:block;color:var(--mut);font-size:13.5px;margin-top:4px;line-height:1.45}
.wp{margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:8px;align-items:center}
.today-mark{box-shadow:inset 0 4px 0 var(--red),var(--lift)}
details.wk.today-mark{border-color:color-mix(in srgb,var(--red) 45%,var(--rule))}
.wbody{padding:0 18px 14px}
.drow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.drow .dl{font-weight:700}.drow .dl small{display:block;font-weight:600;color:var(--mut)}.drow .dl a{font-size:13px}

{

 el.innerHTML=`<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="${r}" fill="none" stroke="#ffffff24" stroke-width="7"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="#ffe46b" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/><circle cx="36" cy="36" r="${r2}" fill="none" stroke="#ffffff14" stroke-width="5"/><circle cx="36" cy="36" r="${r2}" fill="none" stroke="#ff6b7d" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c2}" stroke-dashoffset="${c2*(1-wp)}"/></svg>

 const side=document.querySelector('.side'),stat=document.getElementById('sidestat');

/* ---------- Taymer ---------- */
let TM=null,audioCtx=null;
function beep(){try{const c=audioCtx;if(!c)return;[0,.35,.7].forEach(s=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,c.currentTime+s);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+s+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+s+.3);o.start(c.currentTime+s);o.stop(c.currentTime+s+.32)})}catch(e){}}
function findTask(id){for(const d of DAYS)for(const t of d.tasks)if(t.id===id)return{d,t};return null}
function startTimer(id){const f=findTask(id);if(!f)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume()}catch(e){}
 if(TM)clearInterval(TM.iv);TM={id,left:f.t.m*60,end:Date.now()+f.t.m*60000,paused:false,iv:null};TM.iv=setInterval(tick,500);drawTimer()}
function tick(){if(!TM||TM.paused)return;TM.left=Math.max(0,Math.round((TM.end-Date.now())/1000));if(TM.left===0){clearInterval(TM.iv);TM.doneAt=1;beep();toast('Vaqt tugadi');}drawTimer()}
function drawTimer(){const el=$('timer');if(!TM){el.hidden=true;return}const f=findTask(TM.id);el.hidden=false;const mm=Math.floor(TM.left/60),ss=TM.left%60;
 el.innerHTML=`<div class="tmn"><span class="tag c-${f.t.c}">${CATN[f.t.c]}</span><span class="tmt">${esc(f.t.t)}</span></div><div class="tmc">${pad(mm)}:${pad(ss)}</div>
 <div class="tmb">${TM.doneAt?`<button class="btn pri" id="tmdone">Bajarildi deb belgilash</button>`:`<button class="btn" id="tmp">${TM.paused?'Davom etish':'Pauza'}</button>`}<button class="btn" id="tmx">Yopish</button></div>`;
 if($('tmp'))$('tmp').onclick=()=>{if(TM.paused){TM.end=Date.now()+TM.left*1000;TM.paused=false}else TM.paused=true;drawTimer()};
 $('tmx').onclick=()=>{clearInterval(TM.iv);TM=null;drawTimer()};
 if($('tmdone'))$('tmdone').onclick=()=>{const id=TM.id;clearInterval(TM.iv);TM=null;drawTimer();setDoneLocal(id,true);if(cur()==='bugun')renderToday()}}

function renderCalendar(){

 const last=ds[ds.length-1]||TODAY;const ly=+last.slice(0,4),lm=+last.slice(5,7)-1;

const addDays=(ds,n)=>{const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const boxOf=x=>Math.min(5,Math.max(1,+x.box||1));
const dueOf=x=>x.due||x.added||TODAY;
const dueWords=()=>WORDS.filter(x=>dueOf(x)<=TODAY);
function gradeWord(id,ok){const x=WORDS.find(w=>w.id===id);if(!x)return;const was=boxOf(x);const b=ok?Math.min(5,was+1):1;const gap=ok?(was>=5?14:({2:1,3:2,4:4,5:7})[b]):0;x.box=b;x.due=addDays(TODAY,gap);x.seen=TODAY;saveDoc('words',x,true)}
function renderWords(){
 const w=curWeek();const wkWords=DAYS.filter(d=>d.w===w).flatMap(d=>d.tasks.filter(t=>t.w).flatMap(t=>t.w));

 <p class="kick" style="font-size:14px;margin-top:10px">So'z «Bildim» bosilsa, keyingi safar 1, 2, 4, 7 va 14 kundan keyin chiqadi. «Bilmadim» bosilsa, qaytadan boshlanadi.</p>

 <div class="sec"><h2>Mening so'zlarim (${WORDS.length})</h2>
 ${WORDS.length?`<table class="stack"><thead><tr><th>So'z</th><th>Ma'nosi</th><th>Misol</th><th>Bosqich</th><th>Keyingi takror</th><th></th></tr></thead><tbody>${WORDS.slice().sort((a,b)=>dueOf(a).localeCompare(dueOf(b))).map(x=>`<tr><td data-l="So'z"><b>${esc(x.w)}</b></td><td data-l="Ma'nosi">${esc(x.uz)}</td><td data-l="Misol">${esc(x.ex||'')}</td><td data-l="Bosqich"><span class="boxes" title="${boxOf(x)}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=boxOf(x)?'on':''}"></i>`).join('')}</span></td><td data-l="Takror" style="white-space:nowrap">${dueOf(x)<=TODAY?'<b class="due">bugun</b>':esc(dueOf(x))}</td><td><button class="del" data-delw="${esc(x.id)}" aria-label="${esc(x.w)} so'zini o'chirish">×</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Hali so\'z yo\'q.</div>'}</div>`;

 <div class="sec">${MIST.length?`<ul class="fixes">${MIST.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(m=>`<li class="fix"><p class="x">${esc(m.wrong)}</p><button class="del" data-delm="${esc(m.id)}" aria-label="O'chirish">×</button><p class="v">${esc(m.right)}</p><p class="why">${esc(m.why||'')}<time>${esc(m.date||'')}</time></p></li>`).join('')}</ul>`:'<div class="empty">Hali xato yozilmagan.</div>'}</div>`;
 $('v-xatolar').innerHTML=page(panel,work);
 $('mf').onsubmit=async e=>{e.preventDefault();const m={id:'m'+Date.now(),wrong:$('mw').value.trim(),right:$('mr').value.trim(),why:$('my').value.trim(),date:TODAY};if(!m.wrong||!m.right)return;
  MIST.push(m);renderMist();saveDoc('mistakes',m)};
 $('v-xatolar').querySelectorAll('[data-delm]').forEach(b=>b.onclick=async()=>{const id=b.dataset.delm;MIST=MIST.filter(x=>x.id!==id);renderMist();delDoc('mistakes',id)});
}

/* ---------- Progress ---------- */
function renderProgress(){
 let k=0,n=0;DAYS.forEach(d=>{const[a,b]=dayStats(d);k+=a;n+=b});
 const full=DAYS.filter(d=>{const[a,b]=dayStats(d);return a===b}).length;
 const streak=streakDays();const ndone=DAYS.filter(doneOn).length;const dd=doneDates().sort();
 let pace='';if(dd.length){const f=new Date(dd[0]+'T00:00:00'),now=new Date(TODAY+'T00:00:00');const el=Math.max(1,Math.round((now-f)/864e5)+1);const perW=ndone/el*7;const left=DAYS.length-ndone;
  const proj=n=>{const x=new Date(now);x.setDate(x.getDate()+Math.ceil(left/n*7));return fmtD(iso(x))};
  pace=`<div class="sec"><h2>Tezlik va prognoz</h2><div class="stats"><div class="stat"><b>${perW.toFixed(1)}</b><span>kun haftasiga (sizning tezligingiz)</span></div><div class="stat"><b>${left?proj(Math.max(perW,0.5)):'—'}</b><span>shu tezlikda reja tugashi</span></div><div class="stat"><b>${left?proj(7):'—'}</b><span>rejadagidek (haftasiga 7 kun) davom etsangiz</span></div></div></div>`}
 const mins=DAYS.reduce((s,d)=>s+d.tasks.filter(t=>S.done[t.id]).reduce((x,t)=>x+t.m,0),0);
 const cd=curDay(),all=n?k/n:0,wn=weekStats(cd.w);
 const panel=phead('Progress',`A2 dan Intermediate gacha bosib o'tgan yo'lingiz.`)
  +dial(all,wn[1]?wn[0]/wn[1]:0,pctTxt(all),'reja bajarildi')
  +keys('Butun reja',`${cd.w}-hafta`)
  +facts([['Tugatilgan kunlar',`${ndone}/${DAYS.length}`],['Kun ketma-ket (streak)',streak],['O\'qilgan vaqt',`${Math.round(mins/60)} soat`],['Lug\'atdagi so\'zlar',WORDS.length],['Mustahkam so\'zlar',WORDS.filter(x=>boxOf(x)>=4).length],['Yozilgan xatolar',MIST.length]]);
 const work=`<div class="sechead"><h2>${DAYS.length} kunlik javob varag'i</h2></div>
 <p class="kick" style="margin:-6px 0 12px">Har bir doira bitta dars kuni. Sariq: tugatilgan, qizil halqa: navbatdagi. Bosib o'sha kunni oching.</p>
 <div class="answers">${WEEKS.map(w=>{const[a,b]=weekStats(w.w);return`<div class="arow"><span title="${w.w}-hafta">${w.w}</span>${DAYS.filter(d=>d.w===w.w).map(d=>{const[x,y]=dayStats(d),on=doneOn(d);return`<a class="bub ${on?'full':''} ${d===cd&&!on?'now':''}" href="#kun-${d.date}" style="--p:${Math.round(100*x/y)}%" title="${esc(dname(d))}: ${x}/${y} vazifa${on?', '+esc(fmtD(on)):''}" aria-label="${esc(dname(d))}: ${x}/${y}">${dayNo(d)}</a>`}).join('')}<em>${Math.round(100*a/b)}%</em></div>`}).join('')}</div>
 <div class="sec"><h2>Yo'nalishlar bo'yicha</h2><p class="dd" style="margin:0 0 10px">Bajarilgan daqiqalar, rejadagi jami daqiqalarga nisbatan.</p>${Object.keys(CATN).map(c=>{let pl=0,dn=0;DAYS.forEach(d=>d.tasks.forEach(t=>{if(t.c===c){pl+=t.m;if(S.done[t.id])dn+=t.m}}));const p=pl?Math.round(100*dn/pl):0;
  return`<div class="catrow"><span><span class="tag c-${c}">${CATN[c]}</span></span><div class="bar"><i style="width:${p}%"></i></div><span class="pct">${Math.round(dn/60*10)/10} / ${Math.round(pl/60)} soat</span></div>`}).join('')}</div>
 ${pace}
 <div class="sec"><h2>Test va baholash natijalari</h2>${TESTS.length?`<table class="stack"><thead><tr><th>Sana</th><th>Test</th><th>Natija</th><th>Izoh</th></tr></thead><tbody>${TESTS.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(t=>`<tr><td data-l="Sana" style="white-space:nowrap">${esc(t.date)}</td><td data-l="Test"><b>${esc(t.name)}</b></td><td data-l="Natija">${esc(t.result)}</td><td data-l="Izoh">${esc(t.detail||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Hali natija yo\'q.</div>'}</div>`;
 $('v-progress').innerHTML=page(panel,work);
}
/* ---------- Router ---------- */
const VIEWS=['bugun','kalendar','roadmap','notes','lugat','xatolar','progress'];
const R={bugun:renderToday,kalendar:renderCalendar,roadmap:renderRoadmap,notes:renderNotes,lugat:renderWords,xatolar:renderMist,progress:renderProgress};
function cur(){const h=location.hash.slice(1);if(/^kun-\d{4}-\d{2}-\d{2}$/.test(h))return 'bugun';return VIEWS.includes(h)?h:'bugun'}
function route(){const h=location.hash.slice(1);const m=h.match(/^kun-(\d{4}-\d{2}-\d{2})$/);if(m&&BYDATE[m[1]])selDate=m[1];else if(h==='bugun'||!h){selDate=curDay().date}
 updateHeader();const v=cur();document.title=({bugun:'Bugun',kalendar:'Kalendar',roadmap:'Roadmap',notes:'Notes',lugat:'Lug\'at',xatolar:'Xatolar',progress:'Progress'}[v]||'')+' — IELTS 7 kundaligi';if(m&&BYDATE[m[1]])document.title=dname(BYDATE[m[1]])+' — IELTS 7 kundaligi';VIEWS.forEach(x=>$('v-'+x).classList.toggle('hide',x!==v));const nv=m?'kalendar':v;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+nv));R[v]();}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.getAttribute('href')===location.hash){e.preventDefault();route();window.scrollTo(0,0)}});
document.addEventListener('keydown',e=>{if(cur()!=='bugun'||!DAYS.length)return;const tg=e.target.tagName;if(tg==='TEXTAREA'||tg==='SELECT'||(tg==='INPUT'&&e.target.type!=='checkbox')||e.altKey||e.ctrlKey||e.metaKey)return;
 const i=DAYS.findIndex(d=>d.date===selDate);if(e.key==='ArrowLeft'&&i>0)location.hash='kun-'+DAYS[i-1].date;if(e.key==='ArrowRight'&&i<DAYS.length-1)location.hash='kun-'+DAYS[i+1].date});
(async()=>{
 try{
  const [plan,state,notes,words,mist,tests,writ]=await Promise.all([fetch('/plan.json').then(r=>{if(!r.ok)throw new Error('plan');return r.json()}),api('state'),api('notes'),api('words'),api('mistakes'),api('tests'),api('writings').catch(()=>[])]);
  DAYS=plan.days;WEEKS=plan.weeks;BYDATE=Object.fromEntries(DAYS.map(d=>[d.date,d]));
  S.done=state.done||{};S.dayNotes=state.dayNotes||{};S.dates=state.dates||{};NOTES=notes;WORDS=words;MIST=mist;TESTS=tests;WRIT=Object.fromEntries(writ.map(x=>[x.id,x]));
  selDate=curDay().date;
  renderWho();route();
 }catch(e){console.error(e);if(String(e.message)==='401')return;document.querySelector('main').innerHTML='<div class="banner"><b>Ma\'lumotlar yuklanmadi.</b> Internet aloqasini tekshirib, sahifani yangilang. Muammo davom etsa, Vercel loyihasidagi TURSO_* sozlamalarini tekshiring.</div>'}
})();
}
</script>
